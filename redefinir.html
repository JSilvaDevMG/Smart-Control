<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
</head>
<body>
    <header>
    <h1>Smart Control</h1>
    </header>

    <main>
    <form action="index.html" method="get">
        <h2>Redefinir senha</h2>

        <label for="nova_senha">Insira sua nova senha:</label>
        <input type="password" name="nova_senha" id="nova_senha" placeholder="Digite sua nova senha" required>

        <label for="repetir_senha">Repita sua nova senha:</label>
        <input type="password" name="repetir_senha" id="repetir_senha" placeholder="Repita sua nova senha" required>

        <button type="submit">Confirmar</button>
    </form>
    </main>
</body>
</html>
